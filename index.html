<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dual Value Workshop: an internal brand and marketing workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--paper:#ffffff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--vu:#0077b3;--vu-dark:#005a87;--vu-soft:#e8f2f9;--good:#248a3d;--bad:#d70015;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:0 0 .45em}
h1{font-size:2.6rem}h2{font-size:1.9rem}h3{font-size:1.2rem;letter-spacing:-.01em}
p{margin:0 0 .9em}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
header.top{background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:14px;height:60px;max-width:1240px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:10px}
.brand .vu{display:inline-flex;align-items:center;justify-content:center;background:var(--vu);color:#fff;font-weight:800;font-size:.78rem;letter-spacing:.02em;border-radius:6px;padding:3px 7px}
nav.steps{display:flex;gap:2px;flex:1;overflow-x:auto;background:#ececf0;border-radius:10px;padding:3px}
nav.steps button{border:0;background:none;font:inherit;font-size:.78rem;font-weight:500;color:var(--ink);padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.steps button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--vu)}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap}
.timer b{font-size:1.05rem;font-weight:600;min-width:54px;text-align:right}
.tbtn{border:0;background:#ececf0;font:inherit;font-size:.78rem;font-weight:500;padding:5px 11px;border-radius:980px;cursor:pointer;color:var(--ink)}
.tbtn:hover{background:#e1e1e6}
main{padding:40px 0 90px}
.card{background:var(--paper);border:0;border-radius:18px;padding:30px 34px;margin-bottom:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04)}
.eyebrow{font-size:.78rem;letter-spacing:.02em;color:var(--vu);font-weight:600;margin-bottom:8px}
.lede{font-size:1.25rem;line-height:1.45;color:#424245;font-weight:400}
.muted{color:var(--muted)}.small{font-size:.9rem}.note{font-size:.82rem;color:var(--muted)}
label{display:block;font-weight:600;font-size:.92rem;margin:16px 0 7px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--vu);box-shadow:0 0 0 4px rgba(0,119,179,.15)}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:780px){.grid2,.grid3{grid-template-columns:1fr}h1{font-size:2rem}}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--vu);color:#fff;border:0;font:inherit;font-weight:500;font-size:.95rem;padding:11px 22px;border-radius:980px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--vu-dark)}
.btn.ghost{background:transparent;color:var(--vu);border:1px solid var(--vu)}
.btn.ghost:hover{background:var(--vu-soft)}
.btn.small{padding:6px 14px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.01em}
td.num,th.num{text-align:center}
.score{width:56px;text-align:center;padding:7px;border:1px solid #d2d2d7;border-radius:10px;font:inherit}
.score:focus{outline:none;border-color:var(--vu);box-shadow:0 0 0 4px rgba(0,119,179,.15)}
.hi{background:var(--vu-soft);border-radius:10px}
.bars div{display:grid;grid-template-columns:220px 1fr 140px;gap:12px;align-items:center;margin:4px 0;padding:6px 8px;font-size:.92rem}
.bars .track{height:8px;background:#e8e8ed;border-radius:4px;position:relative}
.bars .fill{position:absolute;top:0;bottom:0;left:0;background:var(--vu);border-radius:4px}
.bars .range{position:absolute;top:-4px;height:16px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.3}
@media(max-width:700px){.bars div{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--vu-soft);color:var(--vu-dark);border-radius:980px;padding:5px 12px;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;cursor:pointer;color:var(--vu-dark);font-size:1rem;padding:0;opacity:.6}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.dcard{background:#fbfbfd;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s}
.dcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.dcard.sel{border-color:var(--vu);box-shadow:0 0 0 3px rgba(0,119,179,.18)}
.dcard .tag{font-size:.72rem;color:var(--vu);font-weight:600}
.dcard h4{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:6px 0 6px}
.dcard p{font-size:.85rem;color:var(--muted);margin:0}
.badge{position:absolute;top:12px;right:12px;font-size:.68rem;padding:3px 8px;border-radius:980px;background:var(--vu);color:#fff;font-weight:600}
.badge.done{background:#e3f3e7;color:var(--good)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid #d2d2d7;border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;font-weight:400;margin:8px 0;transition:border-color .15s}
.opt:hover{border-color:#a1a1a6}
.opt:has(input:checked){border-color:var(--vu);background:var(--vu-soft)}
.opt input{margin-top:4px;accent-color:var(--vu)}
input[type=range]{accent-color:var(--vu)}
.twist{background:#1d1d1f;color:#f5f5f7;border-radius:14px;padding:18px 20px;margin-top:18px}
.coach{background:var(--vu-soft);border-radius:14px;padding:14px 18px;font-size:.94rem;margin-top:16px;color:#1d3b50}
.memo{background:#fbfbfd;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:1.1rem;font-weight:500}
.prompt{border-left:3px solid var(--vu);padding:2px 0 2px 14px;margin:14px 0;font-size:.94rem;color:#424245}
details summary{cursor:pointer;color:var(--vu);font-weight:500}
.hidden{display:none!important}
.report h3{margin-top:22px}
.hero{background:linear-gradient(135deg,#0077b3 0%,#005a87 100%);color:#fff}
.hero .eyebrow{color:rgba(255,255,255,.8)}.hero .lede{color:rgba(255,255,255,.92)}.hero p{color:rgba(255,255,255,.88)}
@media print{header.top,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;padding:0;border-radius:0}.report h3{break-after:avoid}.small,.memo,table,svg{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.vulogo{height:34px;width:auto;display:block}.brand .sep{width:1px;height:24px;background:#d2d2d7}
</style>
</head>

function names(){return S.people.map((p,i)=>p.trim()||`Participant ${i+1}`);}
function stats(){
  const res={}; PRINCIPLES.forEach(([k])=>{const v=names().map((_,i)=>+((S.scores[i]||{})[k]||0)).filter(x=>x>0);
    res[k]= v.length?{mean:v.reduce((a,b)=>a+b,0)/v.length,min:Math.min(...v),max:Math.max(...v),n:v.length}:null;});
  return res;}
function focusPrinciples(){const st=stats();const arr=PRINCIPLES.map(([k])=>[k,st[k]]).filter(x=>x[1]);
  if(!arr.length) return {low:[],spread:null};
  const low=[...arr].sort((a,b)=>a[1].mean-b[1].mean).slice(0,2).map(x=>x[0]);
  const spread=[...arr].sort((a,b)=>(b[1].max-b[1].min)-(a[1].max-a[1].min))[0];
  return {low,spread:spread[1].max-spread[1].min>=2?spread[0]:null};}
const pname=k=>PRINCIPLES.find(p=>p[0]===k)[1];
function chipList(key){return `<div class="addrow"><input type="text" id="in_${key}" placeholder="Add and press Enter"><button class="btn small ghost" onclick="addChip('${key}')">Add</button></div><div class="chips">${S.jtbd[key].map((t,i)=>`<span class="chip">${esc(t)}<button onclick="delChip('${key}',${i})" aria-label="Remove">×</button></span>`).join("")}</div>`;}
window.addChip=k=>{const el=$("#in_"+k);const v=el.value.trim();if(!v)return;S.jtbd[k].push(v);save();render();setTimeout(()=>$("#in_"+k)?.focus(),0);};
window.delChip=(k,i)=>{S.jtbd[k].splice(i,1);save();render();};
function bindInputs(){document.querySelectorAll("[data-bind]").forEach(el=>{const path=el.dataset.bind.split(".");
  el.addEventListener("input",()=>{let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path.at(-1)]=el.type==="range"?+el.value:el.value;save();if(el.dataset.live)render();const ep=$("#envprompt");if(ep&&!ep.dataset.edited&&path[0]==="env")ep.value=envPrompt();});});
  {const c=$("#in_comps");if(c)c.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addComp();}});}
  ["jobs","pains","gains"].forEach(k=>{const el=$("#in_"+k);if(el)el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addChip(k);}});});}
function pyramidSVG(p){const layers=[["Resonance",p.reso],["Responses",p.resp],["Meaning",p.mean],["Salience",p.sal]];
  const shade=v=>{const t=(v-1)/4,a=[232,242,249],b=[0,90,135];return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(",")})`;};
  let s="";const H=40,W=240,cx=130;layers.forEach((L,i)=>{const y=4+i*H,w0=W*i/4,w1=W*(i+1)/4;
  const pts=i===0?`${cx},${y} ${cx+w1/2},${y+H} ${cx-w1/2},${y+H}`:`${cx-w0/2},${y} ${cx+w0/2},${y} ${cx+w1/2},${y+H} ${cx-w1/2},${y+H}`;
  s+=`<polygon points="${pts}" fill="${shade(L[1])}" stroke="#fbf9f4" stroke-width="2"/><text x="${cx}" y="${y+H/2+(i===0?10:4)}" text-anchor="middle" font-family="-apple-system,Helvetica,Arial" font-size="${i===0?8.5:10}" fill="${L[1]>=3.5?"#fbf9f4":"#2a2620"}">${i===0?L[1]:L[0]+" "+L[1]}</text>`;});
  return `<svg viewBox="0 0 260 168" width="260" aria-label="Brand pyramid">${s}</svg>`;}

    <tr><th style="width:170px">Force</th><th>The trend that matters most for us</th><th style="width:150px">For us</th><th style="width:130px">How sure</th></tr>
    ${MACRO.map(([k,t,h])=>`<tr><td><b>${t}</b><div class="note">${h}</div></td>
      <td><input type="text" data-bind="env.macro.${k}.trend" value="${esc(e.macro[k].trend)}"></td>
      <td><select data-bind="env.macro.${k}.impact">${["","Opportunity","Threat","Both"].map(x=>`<option ${e.macro[k].impact===x?"selected":""}>${x}</option>`).join("")}</select></td>
      <td><select data-bind="env.macro.${k}.sure">${["","Confirmed","Likely","A guess"].map(x=>`<option ${e.macro[k].sure===x?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}
  </table></div>
  <div class="prompt">Which one trend, if we ignore it, would hurt our customers most within three years? Who in the room disagrees?</div>

function chipEnv(){return `<div class="addrow"><input type="text" id="in_comps" placeholder="Add and press Enter"><button class="btn small ghost" onclick="addComp()">Add</button></div><div class="chips">${S.env.comps.map((t,i)=>`<span class="chip">${esc(t)}<button onclick="S.env.comps.splice(${i},1);save();render()" aria-label="Remove">×</button></span>`).join("")}</div>`;}
window.addComp=()=>{const el=$("#in_comps");const v=el.value.trim();if(!v)return;S.env.comps.push(v);save();render();setTimeout(()=>$("#in_comps")?.focus(),0);};
window.copyPrompt=async()=>{try{await navigator.clipboard.writeText($("#envprompt").value);$("#envmsg").textContent="Prompt copied. Open your AI tool, paste it, and paste the answer below.";}catch(e){$("#envprompt").select();$("#envmsg").textContent="Select the text and copy it with Ctrl+C or Cmd+C.";}};

function vDil(){const f=focusPrinciples(),sugg=d=>f.low.includes(d.p)||f.spread===d.p;const sorted=[...DILEMMAS].sort((a,b)=>sugg(b)-sugg(a));
  const d=DILEMMAS.find(x=>x.id===S.open);const r=d?(S.dil[d.id]=S.dil[d.id]||{}):null;
  return `
<div class="card">
  <div class="eyebrow">Step 4 · 50 minutes · two or three cards</div>
  <h2>The dilemmas: decide, then decide again</h2>
  <p>Choose two or three cards that feel close to home. For each card: read the situation as if it were yours, decide as a team, then reveal the twist and decide again. Name the principle you give up. Cards marked <i>suggested</i> match your lowest or most disputed scores.</p>
  <div class="cards">${sorted.map(x=>`<div class="dcard ${S.open===x.id?"sel":""}" onclick="openCard('${x.id}')">${S.dil[x.id]?.choice2?`<span class="badge done">done</span>`:sugg(x)?`<span class="badge">suggested</span>`:""}<div class="tag">${x.tag}</div><h4>${x.title}</h4><p>${x.sit.slice(0,95)}…</p></div>`).join("")}</div>
</div>
${d?`<div class="card" id="dpanel">
  <div class="eyebrow">${d.tag}</div><h2>${d.title}</h2>
  <p class="lede">${d.sit}</p>
  <p><b>Make it concrete:</b> where does this happen in our organisation?</p>
  <textarea oninput="S.dil['${d.id}'].where=this.value;save()" placeholder="Our version of this situation">${esc(r.where||"")}</textarea>
  <h3 style="margin-top:16px">${d.q}</h3>
  ${d.opts.map((o,i)=>`<label class="opt"><input type="radio" name="c1" ${r.choice==o?"checked":""} onchange="pick('${d.id}',1,${i})"><span>${o}</span></label>`).join("")}
  <label>Why? (one or two sentences)</label><textarea oninput="S.dil['${d.id}'].why=this.value;save()">${esc(r.why||"")}</textarea>
  <div class="row noprint">${r.twistShown?"":`<button class="btn" onclick="showTwist('${d.id}')">Reveal the twist</button>`}</div>
  ${r.twistShown?`<div class="twist"><b>The twist.</b> ${d.twist}</div>
  <h3 style="margin-top:16px">Do you change your decision?</h3>
  ${["Keep our decision",...d.opts].map((o,i)=>`<label class="opt"><input type="radio" name="c2" ${r.choice2==o?"checked":""} onchange="pick('${d.id}',2,${i})"><span>${o}</span></label>`).join("")}
  <label>Which principle do we give up, or weigh less, with this decision?</label>
  <select onchange="S.dil['${d.id}'].givenUp=this.value;save()"><option></option>${PRINCIPLES.map(([k,t])=>`<option ${r.givenUp===t?"selected":""}>${t}</option>`).join("")}<option ${r.givenUp==="None: no trade-off"?"selected":""}>None: no trade-off</option></select>
  <div class="prompt">${d.ask}</div>
  <label>What this means for us</label><textarea oninput="S.dil['${d.id}'].lesson=this.value;save()">${esc(r.lesson||"")}</textarea>`:""}
</div>`:""}
<div class="card">${nextBtn(5,"Continue to step 5: purpose and commitments")}</div>`;}
window.pick=(id,n,i)=>{const d=DILEMMAS.find(x=>x.id===id);if(n===1)S.dil[id].choice=d.opts[i];else S.dil[id].choice2=['Keep our decision',...d.opts][i];save();if(n===2){const y=window.scrollY;render();window.scrollTo(0,y);}};
window.openCard=id=>{S.open=id;S.dil[id]=S.dil[id]||{};save();render();setTimeout(()=>$("#dpanel")?.scrollIntoView({behavior:"smooth"}),50);};
window.showTwist=id=>{const r=S.dil[id];if(!r.choice){alertBox("Decide first, then reveal the twist.");return;}r.twistShown=true;save();render();setTimeout(()=>$(".twist")?.scrollIntoView({behavior:"smooth",block:"center"}),50);};
function alertBox(msg){const n=document.createElement("div");n.className="coach";n.textContent=msg;n.style.position="fixed";n.style.bottom="20px";n.style.right="20px";n.style.zIndex=50;document.body.appendChild(n);setTimeout(()=>n.remove(),2600);}

const CRIT=["It is a long-term aim, not a campaign","It is central to who we are, not an add-on","It goes beyond our own revenue or budget","It acts across the organisation, not only in communication","It guides decisions and how we spend money","It creates value for society, not at its expense"];
function vPurpose(){const p=S.purpose;const crit=CRIT;return `
<div class="card">
  <div class="eyebrow">Step 5 · 35 minutes · purpose and commitments</div>
  <h2>Our Big Ideal, tested</h2>
  <div class="grid2">
    <div><label>Our best self: what we are uniquely good at</label><textarea data-bind="purpose.best">${esc(p.best)}</textarea></div>
    <div><label>The tension in the world of our customers</label><textarea data-bind="purpose.tension">${esc(p.tension)}</textarea></div>
  </div>
  ${S.org.why?`<div class="coach"><b>This morning you wrote:</b> ${esc(S.org.why)}</div>`:""}
  <label>Big Ideal: where our best self meets that tension</label>
  <textarea data-bind="purpose.ideal" style="min-height:60px">${esc(p.ideal)}</textarea>
  <label>Compare with this morning's why: what changed, and why?</label>
  <textarea data-bind="purpose.whyCompare" style="min-height:60px">${esc(p.whyCompare||"")}</textarea>
  <label>Mainly which type of purpose?</label>
  <select data-bind="purpose.type">${["","Competence-based: our value proposition","Culture-based: the way we work","Cause-based: a broader contribution to society"].map(x=>`<option ${p.type===x?"selected":""}>${x}</option>`).join("")}</select>
  <label>Test it: tick only what the whole room agrees on</label>
  ${crit.map((c,i)=>`<label class="opt"><input type="checkbox" ${p.checks.includes(i)?"checked":""} onchange="toggleCheck(${i})"><span>${c}</span></label>`).join("")}
  <label>Which gap is most visible to our customers, or to our staff?</label>
  <select data-bind="purpose.gap">${["","Competence-cause: what we are good at does not match the cause we claim","Competence-culture: how we work undermines what we promise","Culture-cause: our people do not carry the purpose","No visible gap"].map(x=>`<option ${p.gap===x?"selected":""}>${x}</option>`).join("")}</select>
  <label>The evidence</label><input type="text" data-bind="purpose.gapNote" value="${esc(p.gapNote)}">
</div>
<div class="card">
  <div class="eyebrow">Your moment in the spotlight</div>
  <h3>The management team's point of view</h3>
  <p class="small">Prepare the conversation with your board or management team. Base it on what they have said to you, or on your best estimate if you have not spoken to them yet.</p>
  <label>How does our management team see our core value and positioning today?</label>
  <textarea data-bind="mt.view">${esc(S.mt.view)}</textarea>
  <label>Where does this analysis confirm their view, and where does it challenge it?</label>
  <textarea data-bind="mt.differ">${esc(S.mt.differ)}</textarea>
  <label>The one question we want to ask the management team</label>
  <input type="text" data-bind="mt.ask" value="${esc(S.mt.ask)}">
  <label>Our message to the management team, in two or three sentences</label>
  <textarea data-bind="mt.message" style="min-height:70px">${esc(S.mt.message)}</textarea>
  <div class="prompt">Lead with what your customers experience, show one piece of evidence, and end with a decision you ask them to take.</div>
</div>
<div class="card">
  <h3>Commitments: stop, start, keep</h3>
  <p class="small">Three to five commitments, each with one owner and a date. Look back at the scorecard, the pyramid and the dilemmas: what will we actually do differently?</p>
  <table><tr><th style="width:110px">Type</th><th>What exactly</th><th style="width:160px">Owner</th><th style="width:150px">By</th><th></th></tr>
  ${S.commits.map((c,i)=>`<tr><td><select onchange="S.commits[${i}].type=this.value;save()">${["Stop","Start","Keep"].map(t=>`<option ${c.type===t?"selected":""}>${t}</option>`).join("")}</select></td>
  <td><input type="text" value="${esc(c.what)}" oninput="S.commits[${i}].what=this.value;save()"></td>
  <td><input type="text" value="${esc(c.owner)}" oninput="S.commits[${i}].owner=this.value;save()"></td>
  <td><input type="date" value="${esc(c.date)}" oninput="S.commits[${i}].date=this.value;save()"></td>
  <td><button class="btn small ghost" onclick="S.commits.splice(${i},1);save();render()">×</button></td></tr>`).join("")}</table>
  <button class="btn small ghost" style="margin-top:10px" onclick="S.commits.push({type:'Start',what:'',owner:'',date:''});save();render()">Add commitment</button>
  ${nextBtn(6,"See the report")}
</div>`;}
window.toggleSource=x=>{const a=S.org.sources=S.org.sources||[];const j=a.indexOf(x);j>=0?a.splice(j,1):a.push(x);};
window.toggleCheck=i=>{const c=S.purpose.checks;const j=c.indexOf(i);j>=0?c.splice(j,1):c.push(i);save();};

function reportText(){const st=stats(),o=S.org;let t=`DUAL VALUE WORKSHOP · ${o.name||"Organisation"}${o.date?" · "+o.date:""}\nFacilitator: ${o.facilitator||"-"} · Participants: ${names().length}\nOur customers: ${o.customer||"-"} · Focus group: ${o.focal||"-"}\nApproach: ${o.mode||"-"}${(o.sources||[]).length?" · views of "+o.sources.join(", "):""}\n\nFOR THE MANAGEMENT TEAM\n  Message: ${S.mt.message||"-"}\n  Their view today: ${S.mt.view||"-"}\n  Confirms or challenges: ${S.mt.differ||"-"}\n  Our question: ${S.mt.ask||"-"}\n\n1 · SCORECARD (average, range)\n`;
  PRINCIPLES.forEach(([k,n])=>{const s=st[k];t+=`  ${n}: ${s?s.mean.toFixed(1)+" ("+s.min+" to "+s.max+")":"-"}\n`;});
  t+=`\n2 · CUSTOMER LENS\n  Jobs: ${S.jtbd.jobs.join("; ")||"-"}\n  Pains: ${S.jtbd.pains.join("; ")||"-"}\n  Gains: ${S.jtbd.gains.join("; ")||"-"}\n  Pyramid: salience ${S.pyr.sal}, meaning ${S.pyr.mean}, responses ${S.pyr.resp}, resonance ${S.pyr.reso}\n  Evidence: ${S.pyr.evid||"-"}\n`;
  if(S.ai.said||S.ai.wrong) t+=`  AI mirror: asked "${S.ai.q}". Said: ${S.ai.said}. Wrong or missing: ${S.ai.wrong}\n`;
  const E=S.env;t+=`\n3 · ENVIRONMENT${E.country?" ("+E.country+")":""}\n  Competitors and alternatives: ${E.comps.join("; ")||"-"}\n`;
  MICRO.forEach(([k,n])=>{if(E.micro[k])t+=`  ${n}: ${E.micro[k]}\n`;});
  MACRO.forEach(([k,n])=>{const m=E.macro[k];if(m.trend)t+=`  ${n}: ${m.trend} (${m.impact||"-"}, ${m.sure||"-"})\n`;});
  t+=`\n4 · DILEMMAS\n`;
  DILEMMAS.filter(d=>S.dil[d.id]?.choice).forEach(d=>{const r=S.dil[d.id];t+=`  ${d.title}\n    Our version: ${r.where||"-"}\n    First decision: ${r.choice} (${r.why||"no reason noted"})\n    After the twist: ${r.choice2||"-"} · Principle given up: ${r.givenUp||"-"}\n    What it means: ${r.lesson||"-"}\n`;});
  const p=S.purpose;t+=`\n5 · PURPOSE\n  Best self: ${p.best||"-"}\n  Tension: ${p.tension||"-"}\n  Why this morning: ${S.org.why||"-"}\n  Big Ideal: ${p.ideal}\n  What changed: ${p.whyCompare||"-"}\n  Type: ${p.type||"-"} · Criteria agreed: ${p.checks.length} of ${CRIT.length}\n  Gap: ${p.gap||"-"} ${p.gapNote?"("+p.gapNote+")":""}\n\nCOMMITMENTS\n`;
  S.commits.filter(c=>c.what).forEach(c=>t+=`  ${c.type}: ${c.what} · ${c.owner||"owner?"} · ${c.date||"date?"}\n`);
  return t;}

  <div class="eyebrow">Workshop report</div>
  <h1>${esc(o.name||"Our organisation")}</h1>
  <p class="muted">${[o.date,o.facilitator?"facilitated by "+o.facilitator:"",o.sector].filter(Boolean).map(esc).join(" · ")}</p>
  <p class="small"><b>Our customers:</b> ${esc(o.customer||"-")} · <b>Focus:</b> ${esc(o.focal||"-")}<br>${o.mode?`<b>Approach:</b> ${esc(o.mode)}${(o.sources||[]).length?" · views of "+esc(o.sources.join(", ").toLowerCase()):""}<br>`:""}<b>Participants or interviewees:</b> ${esc(names().join(", "))}</p>
  ${(S.mt.message||S.mt.ask||S.mt.view||S.mt.differ)?`<h3>For the management team</h3>${S.mt.message?`<div class="memo">${esc(S.mt.message)}</div>`:""}<p class="small" style="margin-top:8px">${S.mt.view?`<b>Their view today:</b> ${esc(S.mt.view)}<br>`:""}${S.mt.differ?`<b>Where this analysis confirms or challenges it:</b> ${esc(S.mt.differ)}<br>`:""}${S.mt.ask?`<b>Our question to them:</b> ${esc(S.mt.ask)}`:""}</p>`:""}
  <h3>Scorecard</h3>
  <div class="bars">${PRINCIPLES.map(([k,t])=>{const s=st[k];return s?`<div><span>${t}</span><span class="track"><span class="fill" style="width:${s.mean/5*100}%"></span><span class="range" style="left:${(s.min-1)/4*100}%;width:${(s.max-s.min)/4*100}%"></span></span><span class="small">${s.mean.toFixed(1)} · ${s.min} to ${s.max}</span></div>`:"";}).join("")}</div>
  <h3>Customer lens</h3>
  <div class="grid2" style="align-items:center"><div class="small"><p><b>Jobs:</b> ${esc(S.jtbd.jobs.join("; ")||"-")}</p><p><b>Pains:</b> ${esc(S.jtbd.pains.join("; ")||"-")}</p><p><b>Gains:</b> ${esc(S.jtbd.gains.join("; ")||"-")}</p><p><b>Evidence for the weakest layer:</b> ${esc(S.pyr.evid||"-")}</p>${(S.ai.q||S.ai.said||S.ai.wrong)?`<p><b>AI mirror.</b> Question: ${esc(S.ai.q||"-")}. What it said: ${esc(S.ai.said||"-")}. Wrong or missing: ${esc(S.ai.wrong||"-")}</p>`:""}</div><div style="text-align:center">${pyramidSVG(S.pyr)}</div></div>
  <h3>Environment${S.env.country?" · "+esc(S.env.country):""}</h3>
  <p class="small"><b>Competitors and alternatives:</b> ${esc(S.env.comps.join("; ")||"-")}</p>
  ${MICRO.filter(([k])=>S.env.micro[k]).map(([k,n])=>`<p class="small"><b>${n}:</b> ${esc(S.env.micro[k])}</p>`).join("")}
  ${MACRO.some(([k])=>S.env.macro[k].trend)?`<table><tr><th>Force</th><th>Trend</th><th>For us</th><th>How sure</th></tr>${MACRO.filter(([k])=>S.env.macro[k].trend).map(([k,n])=>`<tr><td>${n}</td><td>${esc(S.env.macro[k].trend)}</td><td>${esc(S.env.macro[k].impact)}</td><td>${esc(S.env.macro[k].sure)}</td></tr>`).join("")}</table>`:""}
  <h3>Dilemmas</h3>
  ${DILEMMAS.filter(d=>S.dil[d.id]?.choice).map(d=>{const r=S.dil[d.id];return `<div class="small" style="margin-bottom:12px"><b>${d.title}</b><br>Our version: ${esc(r.where||"-")}<br>First decision: ${esc(r.choice)}${r.why?" · Why: "+esc(r.why):""}<br>After the twist: ${esc(r.choice2||"-")} · Principle given up: ${esc(r.givenUp||"-")}<br>What it means for us: ${esc(r.lesson||"-")}</div>`;}).join("")||`<p class="note">No dilemmas recorded.</p>`}
  <h3>Purpose</h3><p class="small"><b>Our best self:</b> ${esc(p.best||"-")}<br><b>The tension:</b> ${esc(p.tension||"-")}</p>${S.org.why?`<p class="small"><b>Our why, written at the start:</b> ${esc(S.org.why)}</p>`:""}<div class="memo">${esc(p.ideal)}</div>
  ${p.whyCompare?`<p class="small" style="margin-top:8px"><b>What changed since this morning:</b> ${esc(p.whyCompare)}</p>`:""}
  <p class="small" style="margin-top:8px">${esc(p.type||"")}${p.type?" · ":""}${p.checks.length} of ${CRIT.length} purpose criteria agreed · ${esc(p.gap||"")} ${p.gapNote?"("+esc(p.gapNote)+")":""}</p>
  <h3>Commitments</h3>
  <table><tr><th>Type</th><th>What</th><th>Owner</th><th>By</th></tr>${S.commits.filter(c=>c.what).map(c=>`<tr><td>${c.type}</td><td>${esc(c.what)}</td><td>${esc(c.owner)}</td><td>${esc(c.date)}</td></tr>`).join("")}</table>
</div>
<div class="card noprint">
  <h3>Keep and share</h3>
  <div class="row">
    <button class="btn" onclick="doPrint()">Print or save as PDF</button>
    <button class="btn ghost" onclick="copyReport()">Copy report as text</button>
    <button class="btn ghost" onclick="downloadFile('workshop-report.txt',reportText(),'text/plain')">Download report (.txt)</button>
  </div>
  <div class="coach"><b>No answer is saved.</b> This page does not store anything. When you close or reload it, your answers are gone. Print the report, save it as PDF or download it before you leave.</div>
  <p class="note" id="msg"></p>
</div>`;}
window.doPrint=()=>{try{window.print();}catch(e){$("#msg").textContent="Printing is blocked here. Use Copy or Download instead.";}};
window.copyReport=async()=>{try{await navigator.clipboard.writeText(reportText());$("#msg").textContent="Report copied.";}catch(e){$("#msg").textContent="Copy was blocked. Use Download instead.";}};
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use("downloads");}catch(e){DL=null;}})();
window.downloadFile=async(name,content,type)=>{
  if(DL){try{await DL.save({filename:name,data:new Blob([content],{type})});$("#msg").textContent="Saved "+name+".";}catch(e){$("#msg").textContent="The download was not completed.";}return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();$("#msg").textContent="If no file appeared, use Copy report instead.";}catch(e){$("#msg").textContent="Download was blocked here. Use Copy report instead.";}};

function vGuide(){return `
<div class="card">
  <div class="eyebrow">Facilitator guide</div>
  <h2>Auditing your own organisation</h2>
  <p>This guide brings the Executive MBA marketing block into your own organisation. Use it as points of reflection for interviews and informal conversations with the board, suppliers, customers and colleagues. It can get your individual assignment started or complement it. You can also use it as a workshop with colleagues. It works for commercial and non-commercial organisations alike: wherever the word "customer" fits badly, read "the people we serve".</p>
  <h3>Before the session</h3>
  <ul>
    <li>Consider inviting colleagues from different functions, including at least one person who works with customers every day, and (if possible) higher levels of your organization.</li>
      <li>Prepare the AI mirror: ask two AI assistants the question a new ${"customer"} would ask, and note what they say about you.</li>
     <li>Prepare step 3 (the environment) beforehand.</li>
     <li>For a workshop: Agree in advance on one group to focus on. "Everyone" is not a group.</li>
    <li>Book enough time for the interviews (for the workshop: two hours, one screen, paper and pens for the silent rating).</li>
  </ul>
  <h3>Agenda</h3>
  <table><tr><th>Step</th><th>Minutes</th><th>What happens</th></tr>
  <tr><td>Start</td><td>10</td><td>Purpose of the session, ground rules, a first one-line why</td></tr>
  <tr><td>1 · Scorecard</td><td>30</td><td>Silent rating of the core principles, including value for society, then discuss the lowest and most disputed</td></tr>
  <tr><td>2 · Customer lens</td><td>35</td><td>Jobs, pains and gains; the brand pyramid; the AI mirror</td></tr>
  <tr><td>3 · Environment</td><td>30</td><td>Micro and macro environment, competitors; AI draft checked by the room</td></tr>
  <tr><td>4 · Dilemmas</td><td>50</td><td>Two or three cards: decide, twist, decide again, name the trade-off</td></tr>
  <tr><td>5 · Purpose and commitments</td><td>35</td><td>Big Ideal compared with the why, purpose test, gap; stop, start, keep</td></tr>
  <tr><td>Close</td><td>10</td><td>Summarize a few key takeaways and commitments</td></tr></table>
  <h3>Prompts that work</h3>
  <ul>
    <li>"What did you see, hear or measure that makes you give it a 2?"</li>
    <li>"If a new ${"customer"} asked an AI about us tomorrow, what would they read?"</li>
    <li>"If a new ${"customer"} asked our most loyal customer about us tomorrow, what would they hear?"</li>
    <li>"Which principle are we giving up with decision XYZ, and are we comfortable with that?"</li>
    <li>"What would we stop doing if we took this Big Ideal seriously?"</li>
  </ul>
  <h3>Confidentiality</h3>
  <p>No answer is saved or sent anywhere. Everything typed here exists only while the page is open; closing or reloading the page erases it. The only copy is the report you print or download yourself.</p>
</div>`;}

/* ===================== RENDER ===================== */
function render(){renderSteps();const v=[vStart,vScore,vLens,vEnv,vDil,vPurpose,vReport,vGuide][S.step]||vStart;$("#main").innerHTML=v();bindInputs();}
render();tReset();
</script>
